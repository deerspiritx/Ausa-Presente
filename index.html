<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>慧创电商日报</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f4ef;--card:#fff;--card2:#f0ede6;--hover:#e8e4db;
  --border:rgba(0,0,0,.07);--border-m:rgba(0,0,0,.13);
  --text:#1a1714;--text2:#5c5750;--text3:#9c9690;
  --qy:#2B5F8E;--zs:#4E855A;--purple:#9A7FD0;--orange:#B66A2C;
  --mj:#F5DEB3;--ch:#C1440E;--mj-b:#d4a84b;--ch-b:#8b2500;
  --radius:10px;--radius-s:6px;
}
body{background:var(--bg);color:var(--text);font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;font-size:14px;line-height:1.6;min-height:100vh}
.page{max-width:1160px;margin:0 auto;padding:28px 20px 72px}
.header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;flex-wrap:wrap;gap:12px;border-bottom:2px solid var(--qy);padding-bottom:16px}
.header-left h1{font-size:23px;font-weight:800;letter-spacing:.04em;color:var(--text)}
.header-left .sub{font-size:12px;color:var(--text3);margin-top:3px;letter-spacing:.02em}
.header-right{text-align:right}
.date-badge{display:inline-block;background:var(--card2);border:1px solid var(--border-m);border-radius:var(--radius-s);padding:5px 14px;font-size:12px;color:var(--text2)}
.date-badge strong{color:var(--qy);font-weight:700}
.small-note{font-size:11px;color:var(--text3);margin-top:4px;text-align:right}
.dept-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 18px}
.tab{padding:7px 16px;font-size:12px;border:1px solid var(--border-m);border-radius:var(--radius-s);cursor:pointer;background:var(--card);color:var(--text2);transition:all .18s;font-family:inherit;white-space:nowrap}
.tab:hover{background:var(--hover)}
.tab.active{border-color:var(--qy);color:var(--qy);background:rgba(43,95,142,.08);font-weight:700}
.event-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;box-shadow:0 1px 4px rgba(0,0,0,.04);margin-bottom:22px;color:var(--text2);font-size:12px}
.section{margin-top:28px}
.section-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.section-mark{width:4px;height:18px;border-radius:2px;background:var(--qy);flex-shrink:0}
.section-mark.green{background:var(--zs)}.section-mark.orange{background:var(--orange)}.section-mark.purple{background:var(--purple)}
.section-title{font-size:15px;font-weight:800;letter-spacing:.03em}
.divider{border:none;border-top:1px solid var(--border);margin:30px 0 0}
.category-block{margin-bottom:18px}
.kpi-tag{display:inline-block;padding:4px 10px;border-radius:4px;font-size:14px;font-weight:900;letter-spacing:.04em;margin-bottom:10px}
.kpi-tag.blue{background:rgba(43,95,142,.10);color:var(--qy)}.kpi-tag.green{background:rgba(78,133,90,.10);color:var(--zs)}.kpi-tag.purple{background:rgba(115,83,164,.10);color:var(--purple)}.kpi-tag.orange{background:rgba(182,106,44,.10);color:var(--orange)}
.core-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:900px){.core-grid{grid-template-columns:1fr}}
.kpi-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:0 1px 4px rgba(0,0,0,.04);position:relative;overflow:hidden;min-height:122px}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.kpi-card.blue::before{background:var(--qy)}.kpi-card.green::before{background:var(--zs)}.kpi-card.purple::before{background:var(--purple)}.kpi-card.orange::before{background:var(--orange)}
.kpi-label{font-size:11px;color:var(--text3);margin-bottom:6px;letter-spacing:.02em}
.kpi-val{font-size:24px;font-weight:800;line-height:1.1;letter-spacing:-.01em}
.kpi-val.blue{color:var(--qy)}.kpi-val.green{color:var(--zs)}.kpi-val.purple{color:var(--purple)}.kpi-val.orange{color:var(--orange)}
.kpi-unit{font-size:12px;font-weight:400;color:var(--text3);margin-left:3px}
.kpi-sub{font-size:13px;color:var(--text3);margin-top:7px}
.yoy-pos{color:var(--zs);font-weight:900;font-size:15px}.yoy-neg{color:var(--ch);font-weight:900;font-size:15px}
.progress-line{margin-top:8px}
.progress-meta{display:flex;justify-content:space-between;gap:8px;font-size:10.5px;color:var(--text3);margin-bottom:4px}
.progress-target{color:var(--ch);font-weight:900;font-size:13px}
.progress{height:6px;border-radius:999px;background:var(--card2);overflow:hidden;border:1px solid var(--border)}
.progress span{display:block;height:100%;border-radius:999px;background:var(--qy);min-width:3px}
.chart-row{display:grid;grid-template-columns:1fr;gap:16px;margin-top:4px}
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.chart-card-title{font-size:13px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0}
.legend-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;font-size:11px;color:var(--text2);align-items:center}
.leg{display:flex;align-items:center;gap:4px}.leg-line{display:inline-block;width:16px;height:2px;border-radius:1px;vertical-align:middle}.leg-dash{display:inline-block;width:16px;height:0;border-top:2px dashed;vertical-align:middle}.leg-bar{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:middle;border:1px solid rgba(0,0,0,.2)}.leg-sep{width:1px;height:12px;background:var(--border-m);margin:0 2px}
.chart-wrap{position:relative;width:100%;height:260px}.chart-note{font-size:10.5px;color:var(--text3);margin-bottom:8px}
.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}@media(max-width:780px){.summary-grid{grid-template-columns:1fr}}
.formula-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:0 1px 4px rgba(0,0,0,.04);font-size:12px;color:var(--text2)}.formula-card strong{color:var(--text)}
.table-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}thead tr{background:var(--card2)}th{padding:8px 10px;text-align:left;font-weight:700;color:var(--text2);font-size:11px;letter-spacing:.02em;border-bottom:1px solid var(--border-m);white-space:nowrap}td{padding:7px 10px;border-bottom:1px solid var(--border);color:var(--text);white-space:nowrap}tr:last-child td{border-bottom:none}tr:hover td{background:var(--hover)}
.rate-tag{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:700}.rate-good{background:rgba(78,133,90,.12);color:var(--zs)}.rate-bad{background:rgba(193,68,14,.10);color:var(--ch)}.total-row td{font-weight:800;background:var(--card2);border-top:1px solid var(--border-m)}
.footer-note{font-size:11px;color:var(--text3);margin-top:12px;line-height:1.7}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border-m);border-radius:3px}
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <div class="header-left"><h1 id="reportTitle">慧创电商日报</h1><div class="sub" id="deptSub">Huichuang E-commerce Daily Report</div></div>
    <div class="header-right"><div class="date-badge">填报日期：<strong id="reportDate">—</strong></div><div class="small-note" id="unitNote">GMV单位：万元</div></div>
  </div>
  <div class="dept-tabs" id="deptTabs"></div>
  <div class="event-card" id="eventNote">—</div>

  <div class="section">
    <div class="section-head"><div class="section-mark"></div><div class="section-title">核心数据总览</div></div>
    <div id="coreContainer"></div>

  <hr class="divider">

  <div class="section">

  </div>

  <hr class="divider">

  <div class="section">
    <div class="section-head"><div class="section-mark purple"></div><div class="section-title">投入产出</div></div>
    <div class="summary-grid" id="ioContainer"></div>
  </div>

  <hr class="divider">

  <div class="section">
    <div class="section-head"><div class="section-mark orange"></div><div class="section-title">渠道明细数据</div></div>

    <div class="footer-note" id="schemaTips"></div>
  </div>
</div>

function yoyHtml(v){if(v===null||v===undefined||v==='')return '<span style="color:var(--text3)">—</span>'; const n=Number(v); const cls=n>=0?'yoy-pos':'yoy-neg'; return `<span class="${cls}">${pct(n)}</span>`;}
function progressWidth(v){const n=Number(v)||0; return Math.max(0, Math.min(100, n));}
function getDepartments(){return REPORT_DATA['部门'] || [];}
function getMeta(){return REPORT_DATA['报表信息'] || {};}
function getRules(){return REPORT_DATA['计算口径'] || {};}
function prepareTabs(){
  const tabs=document.getElementById('deptTabs');
  tabs.innerHTML=getDepartments().map((d,i)=>`<button class="tab ${i===currentDeptIndex?'active':''}" onclick="switchDept(${i})">${d['部门名称']}</button>`).join('');
}
function switchDept(i){currentDeptIndex=i;prepareTabs();renderAll();}
function renderHeader(dept){
  document.getElementById('reportTitle').textContent='慧创电商日报';
  document.getElementById('deptSub').textContent=dept['部门名称'] || 'Huichuang E-commerce Daily Report';
  document.getElementById('reportDate').textContent=dept['填报日期'] || getMeta()['填报日期'] || '—';
  document.getElementById('unitNote').textContent=`销量单位：${dept['单位']?.['销量']||'—'} · GMV单位：${dept['单位']?.['GMV']||'—'}`;
  document.getElementById('eventNote').innerHTML='<strong>大促 / 异常事件：</strong>'+(dept['大促事件提示']||'无');
}
function sumMetric(rows,key){return rows.reduce((sum,row)=>sum+(Number(row[key])||0),0);}
function pctFrom(numerator,denominator){return denominator?Number((numerator/denominator*100).toFixed(2)):null;}
function getManualTarget(deptName,category){
  const targets=REPORT_DATA['人工填写']?.['目标GMV'] || {};
  return targets[deptName]?.[category] || {};
}
function buildHealthTotal(dept){
  if(dept['部门ID']!=='health') return null;
  const rows=dept['核心数据'] || [];
  if(!rows.length) return null;
  const target=getManualTarget('大健康','总目标');
  const monthGmv=sumMetric(rows,'本月累计GMV');
  const yearGmv=sumMetric(rows,'本年累计GMV');
  const lastMonthGmv=sumMetric(rows,'去年同期本月累计GMV');
  const lastYearGmv=sumMetric(rows,'去年同期本年累计GMV');
  return {
    '品类':'合计',
    '单日GMV':sumMetric(rows,'单日GMV'),
    '单日销量':sumMetric(rows,'单日销量'),
    '本月累计GMV':monthGmv,
    '近30天GMV':sumMetric(rows,'近30天GMV'),
    '月目标GMV':target['月目标GMV'] ?? null,
    '月目标完成率':pctFrom(monthGmv,target['月目标GMV']),
    '去年同期本月累计GMV':lastMonthGmv || null,
    '月同比':pctFrom(monthGmv-lastMonthGmv,lastMonthGmv),
    '本年累计GMV':yearGmv,
    '近365天GMV':sumMetric(rows,'近365天GMV'),
    '年目标GMV':target['年目标GMV'] ?? null,
    '年目标完成率':pctFrom(yearGmv,target['年目标GMV']),
    '去年同期本年累计GMV':lastYearGmv || null,
    '年同比':pctFrom(yearGmv-lastYearGmv,lastYearGmv)
  };
}
function coreRowsForDept(dept){
  const rows=dept['核心数据'] || [];
  const total=buildHealthTotal(dept);
  return total?[total,...rows]:rows;
}
function renderCore(dept){
  const unitG=dept['单位']?.['GMV']||''; const unitS=dept['单位']?.['销量']||'';
  document.getElementById('coreContainer').innerHTML=coreRowsForDept(dept).map((c,i)=>{
    const color=colorBy(i); const tagCls=['blue','green','purple','orange'][i%4]; const p=progressWidth(c['月目标完成率']); const yp=progressWidth(c['年目标完成率']);
    return `<div class="category-block">
      <span class="kpi-tag ${tagCls}">${c['品类']}</span>
      <div class="core-grid">
        <div class="kpi-card ${tagCls}">
          <div class="kpi-label">单日GMV</div>
          <div class="kpi-val ${tagCls}">${fmt(c['单日GMV'])}<span class="kpi-unit">${unitG}</span></div>
          <div class="kpi-sub">单日销量：${fmt(c['单日销量'],0)} ${unitS}</div>
        </div>
        <div class="kpi-card ${tagCls}">
          <div class="kpi-label">本月累计GMV</div>
          <div class="kpi-val ${tagCls}">${fmt(c['本月累计GMV'])}<span class="kpi-unit">${unitG}</span></div>
          <div class="kpi-sub">近30天GMV：${fmt(c['近30天GMV'])} ${unitG} · 月同比：${yoyHtml(c['月同比'])}</div>
          <div class="progress-line"><div class="progress-meta"><span>月目标进度</span><span class="progress-target">${rate(c['月目标完成率'])} / 目标 ${fmt(c['月目标GMV'])} ${unitG}</span></div><div class="progress"><span style="width:${p}%;background:${color}"></span></div></div>
        </div>
        <div class="kpi-card ${tagCls}">
          <div class="kpi-label">本年累计GMV</div>
          <div class="kpi-val ${tagCls}">${fmt(c['本年累计GMV'])}<span class="kpi-unit">${unitG}</span></div>
          <div class="kpi-sub">近365天GMV：${fmt(c['近365天GMV'])} ${unitG}</div>
          <div class="kpi-sub">年同比：${yoyHtml(c['年同比'])}</div>
          <div class="progress-line"><div class="progress-meta"><span>年目标进度</span><span class="progress-target">${rate(c['年目标完成率'])} / 目标 ${fmt(c['年目标GMV'])} ${unitG}</span></div><div class="progress"><span style="width:${yp}%;background:${color}"></span></div></div>
        </div>
      </div>
    </div>`;
  }).join('');
}
function extractLabels(series){
  const first=Object.values(series||{})[0];
  const arr=first?.['今年每日GMV']||[];
  return arr.map(x=>x['日期']);
}
function shortDate(dateStr){const parts=String(dateStr||'').split('-');return parts.length===3?`${Number(parts[1])}/${Number(parts[2])}`:dateStr;}
function xTickCb(value,index){const lbl=this.getLabelForValue(value); return String(lbl).endsWith('-01')?Number(String(lbl).slice(5,7))+'月':'';}
function makeTrendOpts(unit){return {responsive:true,maintainAspectRatio:false,animation:{duration:300},interaction:{mode:'index',intersect:false},plugins:{legend:{display:false},tooltip:{backgroundColor:'#fff',borderColor:'rgba(0,0,0,.10)',borderWidth:1,titleColor:'#1a1714',bodyColor:'#5c5750',callbacks:{title:items=>'日期：'+shortDate(items[0].label),label:ctx=>{const v=ctx.parsed.y;if(v===null||v===undefined)return null;const u=ctx.dataset.yAxisID==='yBar'?`${unit}（月累计）`:unit;return `${ctx.dataset.label}：${v} ${u}`;}}}},scales:{x:{ticks:{color:'#9c9690',font:{size:10},maxRotation:0,autoSkip:false,callback:xTickCb},grid:{color:'rgba(0,0,0,.04)'}},yLine:{type:'linear',position:'left',beginAtZero:false,ticks:{color:'#9c9690',font:{size:10},callback:v=>v},grid:{color:'rgba(0,0,0,.06)'},title:{display:true,text:`每日GMV（${unit}）`,color:'#9c9690',font:{size:9}}},yBar:{type:'linear',position:'right',beginAtZero:true,ticks:{color:'#C1440E',font:{size:10},callback:v=>v},grid:{drawOnChartArea:false},title:{display:true,text:'月度累计',color:'#C1440E',font:{size:9}}}}};}
function mkLine(label,data,color,dashed){return {type:'line',label,data,borderColor:color,backgroundColor:'transparent',pointRadius:0,pointHoverRadius:4,pointBackgroundColor:color,tension:.4,fill:false,borderWidth:dashed?1.5:2,borderDash:dashed?[5,4]:[],spanGaps:false,order:dashed?2:1,yAxisID:'yLine'};}
function mkBar(label,data,bg,border){return {type:'bar',label,data,backgroundColor:bg,borderColor:border,borderWidth:1,borderRadius:3,barThickness:7,order:3,yAxisID:'yBar',skipNull:true};}
function monthlyBars(s, labels){
  const target=new Array(labels.length).fill(null), actual=new Array(labels.length).fill(null);
  const posByMonth={}; labels.forEach((d,i)=>{const m=d.slice(0,7); if(!(m in posByMonth)) posByMonth[m]=[]; posByMonth[m].push(i);});
  (s['月度目标GMV']||[]).forEach(m=>{const arr=posByMonth[m['月份']]||[]; if(arr.length) target[arr[Math.max(0,Math.floor(arr.length/2)-1)]]=m['GMV'];});
  (s['月度完成GMV']||[]).forEach(m=>{const arr=posByMonth[m['月份']]||[]; if(arr.length) actual[arr[Math.min(arr.length-1,Math.floor(arr.length/2)+1)]]=m['GMV'];});
  return {target,actual};
}
function sumDailyTrend(trendList,key,labels){
  return labels.map((_,idx)=>{
    let total=0, hasValue=false;
    trendList.forEach(s=>{
      const v=s?.[key]?.[idx]?.['GMV'];
      if(v!==null && v!==undefined && v!==''){total+=Number(v)||0; hasValue=true;}
    });
    return hasValue?Number(total.toFixed(2)):null;
  });
}
function sumMonthlyTrend(trendList,key,months){
  return months.map(month=>{
    let total=0, hasValue=false;
    trendList.forEach(s=>{
      const row=(s?.[key]||[]).find(x=>x['月份']===month);
      const v=row?.['GMV'];
      if(v!==null && v!==undefined && v!==''){total+=Number(v)||0; hasValue=true;}
    });
    return {'月份':month,'GMV':hasValue?Number(total.toFixed(2)):null};
  });
}
function buildHealthTotalTrend(dept,trends,labels){
  if(dept['部门ID']!=='health') return null;
  const trendList=(dept['核心数据']||[]).map(c=>trends[c['品类']]).filter(Boolean);
  if(!trendList.length) return null;
  const months=Array.from({length:12},(_,i)=>`${dept['GMV趋势']?.['年份']||new Date().getFullYear()}-${String(i+1).padStart(2,'0')}`);
  const target=getManualTarget('大健康','总目标')?.['月度目标GMV'] || {};
  return {
    '今年每日GMV':sumDailyTrend(trendList,'今年每日GMV',labels).map((v,i)=>({'日期':labels[i],'GMV':v})),
    '去年同期每日GMV':sumDailyTrend(trendList,'去年同期每日GMV',labels).map((v,i)=>({'日期':labels[i]?.replace(String(dept['GMV趋势']?.['年份']||''),String(dept['GMV趋势']?.['对比年份']||'')),'GMV':v})),
    '月度目标GMV':months.map(m=>({'月份':m,'GMV':target[m] ?? null})),
    '月度完成GMV':sumMonthlyTrend(trendList,'月度完成GMV',months)
  };
}
function chartRowsForDept(dept){
  const rows=dept['核心数据'] || [];
  return dept['部门ID']==='health'?[{'品类':'合计'},...rows]:rows;
}
function renderCharts(dept){
  charts.forEach(c=>c.destroy()); charts=[];
  const trends=dept['GMV趋势']?.['品类趋势'] || {}; const labels=extractLabels(trends); const unit=dept['单位']?.['GMV']||'';
  const chartRows=chartRowsForDept(dept);
  const healthTotalTrend=buildHealthTotalTrend(dept,trends,labels);
  document.getElementById('chartContainer').innerHTML=chartRows.map((c,i)=>{
    const color=colorBy(i);
    return `<div class="chart-card"><div class="chart-card-title"><span class="dot" style="background:${color}"></span>${c['品类']} · 每日GMV趋势</div><div class="legend-row"><span class="leg"><span class="leg-line" style="background:${color}"></span><span style="color:${color};font-weight:500">今年</span></span><span class="leg"><span class="leg-dash" style="border-color:${color}55"></span><span style="color:var(--text3)">去年同期</span></span><span class="leg-sep"></span><span class="leg"><span class="leg-bar" style="background:var(--mj)"></span>月度计划</span><span class="leg"><span class="leg-bar" style="background:var(--ch)"></span>月度完成</span></div><div class="chart-note">左轴：每日GMV（${unit}）· 右轴：月度累计GMV（${unit}）</div><div class="chart-wrap"><canvas id="chart_${dept['部门ID']}_${i}"></canvas></div></div>`;
  }).join('');
  setTimeout(()=>{
    chartRows.forEach((c,i)=>{
      const s=c['品类']==='合计'?healthTotalTrend:trends[c['品类']]; if(!s)return;
      const bars=monthlyBars(s,labels); const cur=(s['今年每日GMV']||[]).map(d=>d['GMV']); const ly=(s['去年同期每日GMV']||[]).map(d=>d['GMV']); const color=colorBy(i);
      const ctx=document.getElementById(`chart_${dept['部门ID']}_${i}`);
      if(ctx && window.Chart) charts.push(new Chart(ctx,{type:'bar',data:{labels,datasets:[mkBar('月度计划',bars.target,'rgba(245,222,179,.85)','#d4a84b'),mkBar('月度完成',bars.actual,'rgba(193,68,14,.75)','#8b2500'),mkLine(`今年·${c['品类']}`,cur,color,false),mkLine(`去年同期·${c['品类']}`,ly,color+'55',true)]},options:makeTrendOpts(unit)}));
    });
  },0);
}
function renderIO(dept){
  const io=dept['投入产出']||{}; const unit=dept['单位']?.['GMV']||'';
  document.getElementById('ioContainer').innerHTML=`<div class="formula-card"><strong>单日总GMV</strong><br><span style="font-size:22px;font-weight:800;color:var(--qy)">${fmt(io['单日总GMV'])}</span> ${unit}<br><span style="color:var(--text3)">来自当前部门各渠道/品类汇总</span></div><div class="formula-card"><strong>单日总投入</strong><br><span style="font-size:22px;font-weight:800;color:var(--purple)">${fmt(io['单日总投入'])}</span> ${unit}<br><span style="color:var(--text3)">${io['备注']||''}</span></div><div class="formula-card"><strong>投入产出比</strong><br><span style="font-size:22px;font-weight:800;color:var(--zs)">${rate(io['单日投入产出比'])}</span><br><span style="color:var(--text3)">${getRules()['投入产出比']||''}</span></div>`;
}
function renderDetails(dept){
  const rows=dept['明细数据']||[]; const body=document.getElementById('detailBody');
  const htmlRows=rows.map(r=>`<tr><td><strong>${r['品类']}</strong></td><td>${r['渠道']}</td><td>${fmt(r['单日销量'],0)}</td><td>${fmt(r['单日GMV'])}</td><td>${fmt(r['本月累计销量'],0)}</td><td>${fmt(r['本月累计GMV'])}</td><td>${fmt(r['月目标GMV'])}</td><td>${rateTag(r['月完成率'])}</td><td>${fmt(r['本年累计销量'],0)}</td><td>${fmt(r['本年累计GMV'])}</td><td>${fmt(r['年目标GMV'])}</td><td>${rateTag(r['年完成率'])}</td><td>${fmt(r['单日投入'])}</td><td>${rateTag(r['ROI'])}</td></tr>`).join('');
  const sum=k=>rows.reduce((a,r)=>a+(Number(r[k])||0),0);
  body.innerHTML=htmlRows+`<tr class="total-row"><td colspan="2">合计</td><td>${fmt(sum('单日销量'),0)}</td><td>${fmt(sum('单日GMV'))}</td><td>${fmt(sum('本月累计销量'),0)}</td><td>${fmt(sum('本月累计GMV'))}</td><td>${fmt(sum('月目标GMV'))}</td><td>${rateTag(sum('本月累计GMV')/sum('月目标GMV')*100)}</td><td>${fmt(sum('本年累计销量'),0)}</td><td>${fmt(sum('本年累计GMV'))}</td><td>${fmt(sum('年目标GMV'))}</td><td>${rateTag(sum('本年累计GMV')/sum('年目标GMV')*100)}</td><td>${fmt(sum('单日投入'))}</td><td>${rateTag(sum('单日GMV')/sum('单日投入')*100)}</td></tr>`;
  const rules=getRules();
  document.getElementById('schemaTips').innerHTML=`计算口径：月同比=${rules['月同比']||'—'}；年同比=${rules['年同比']||'—'}。`;
}
function renderAll(){const dept=getDepartments()[currentDeptIndex]; if(!dept)return; renderHeader(dept); renderCore(dept); renderCharts(dept); renderIO(dept); renderDetails(dept);}
async function loadExternalData(){
  try{const res=await fetch('./huichuang_ecommerce_daily_report_data.json',{cache:'no-store'}); if(res.ok) REPORT_DATA=await res.json();}
  catch(e){/* 直接双击HTML时可能无法读取外部JSON，自动使用内置示例数据 */}
}
loadExternalData().then(()=>{prepareTabs();renderAll();});
</script>
